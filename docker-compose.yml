services:
  # ─── Lobsterpedia (Single Container) ─────────────────────────────────
  claw-lobsterpedia:
    image: ghcr.io/clawstackstudios/lobsterpedia:latest
    container_name: lobsterpedia
    ports:
      - "7575:7575"
    # ─── Docker Bind Mount for Wiki ───────
    volumes:
      - ./wiki:/app/wiki
    environment:
      - NODE_ENV=production
      - PORT=7575
      - HOST=0.0.0.0
      - WIKI_PATH=/app/wiki
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PUID=1000
      - PGID=1000
      - TRUST_PROXY=true
      - ENFORCE_HTTPS=false
      # For detailed configuration, see README.md → Running with Docker section
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7575/api/wiki/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
